<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Yavuz & Neslihan</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:900px;
margin:auto;
background:white;
padding:20px;

.gallery{

.card{

}

.info{

}
</style>
</head>

<body>

<div class="box" id="loginBox">
<h2>Admin Girişi</h2>

<input type="text" id="username" placeholder="Kullanıcı Adı">
<input type="password" id="password" placeholder="Şifre">

<button onclick="login()">Giriş Yap</button>

<p id="error" style="color:red"></p>
</div>

<div class="box" id="panel" style="display:none;">
<h2>Yavuz & Neslihan Wedding Admin Paneli</h2>

<div id="photoCount"></div>

<div class="gallery" id="gallery"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCnqrXOPb4OGDLUhUIV2flDi-d3nStNtF8",
authDomain: "yavuz-neslihan-wedding.firebaseapp.com",
projectId: "yavuz-neslihan-wedding",
storageBucket: "yavuz-neslihan-wedding.firebasestorage.app",
messagingSenderId: "425295190625",
appId: "1:425295190625:web:7477980076a325bc0fe820",
measurementId: "G-VDBHQ54R05"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = async function(){

const user =
document.getElementById("username").value;

const pass =
document.getElementById("password").value;

if(
user !== "yavuzadmin" ||
pass !== "Howruyst94."
){
document.getElementById("error").innerText =
"Hatalı giriş";
return;
}

document.getElementById("loginBox").style.display =
"none";

document.getElementById("panel").style.display =
"block";

loadPhotos();
}

async function loadPhotos(){

const gallery =
document.getElementById("gallery");

gallery.innerHTML = "";

const q =
query(collection(db,"photos"));

const snapshot =
await getDocs(q);

document.getElementById("photoCount").innerHTML =
"<b>Toplam Fotoğraf:</b> " + snapshot.size;

snapshot.forEach((doc)=>{

const data = doc.data();

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `
<img src="${data.photoUrl}">
<div class="info">
<b>${data.name}</b><br>
${data.date}<br><br>

<a href="${data.photoUrl}" download target="_blank">
<button>📥 İndir</button>
</a>

</div>
`;
`;

gallery.appendChild(card);

});

}
</script>

</body>
</html>
