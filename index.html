```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yavuz & Neslihan Wedding Hatıra Alanı</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}
 
.box{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
box-sizing:border-box;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

.msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}
.monogram{
position:relative;
height:90px;
margin-bottom:15px;
}

.monogram .y{
position:absolute;
left:50%;
transform:translateX(-60%);
font-size:90px;
font-family:'Cormorant Garamond', serif;
font-style:italic;
font-weight:bold;
color:#b08d57;
}

.monogram .n{
position:absolute;
left:50%;
transform:translateX(-10%);
font-size:90px;
font-family:'Cormorant Garamond', serif;
font-style:italic;
font-weight:bold;
color:#b08d57;
opacity:0.9;
}  
</style>
</head>

<body>

<div class="box">
<div class="monogram">
    <span class="y">Y</span>
    <span class="n">N</span>
</div>
<h2>Yavuz & Neslihan<br>Wedding Hatıra Alanı</h2>

<input
type="text"
id="name"
placeholder="Ad Soyad">

<input
type="file"
id="photos"
multiple
accept="image/*">

<button onclick="uploadPhotos()">
Fotoğrafları Yükle
</button>

<div id="msg" class="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCnqrXOPb4OGDLUhUIV2flDi-d3nStNtF8",
authDomain: "yavuz-neslihan-wedding.firebaseapp.com",
projectId: "yavuz-neslihan-wedding",
storageBucket: "yavuz-neslihan-wedding.firebasestorage.app",
messagingSenderId: "425295190625",
appId: "1:425295190625:web:7477980076a325bc0fe820",
measurementId: "G-VDBHQ54R05"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CLOUD_NAME = "dr8vx5dlj";
const UPLOAD_PRESET = "wedding_upload";

window.uploadPhotos = async function(){

const msg = document.getElementById("msg");

const name = document.getElementById("name").value.trim();

const files = document.getElementById("photos").files;

if(!name){
msg.innerText="Ad Soyad giriniz";
return;
}

if(files.length===0){
msg.innerText="Fotoğraf seçiniz";
return;
}

if(files.length>5){
msg.innerText="En fazla 5 fotoğraf yükleyebilirsiniz";
return;
}

msg.innerText="Yükleniyor...";

for(const file of files){

const formData = new FormData();

formData.append("file",file);
formData.append("upload_preset",UPLOAD_PRESET);

const response = await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
{
method:"POST",
body:formData
}
);

const data = await response.json();

await addDoc(
collection(db,"photos"),
{
name:name,
photoUrl:data.secure_url,
date:new Date().toLocaleString("tr-TR")
}
);

}

msg.innerText="Fotoğraflar başarıyla yüklendi 🎉";

document.getElementById("photos").value="";
};

</script>

</body>
</html>
