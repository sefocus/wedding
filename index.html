<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yavuz & Neslihan Wedding Hatıra Alanı</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; padding:20px }
    .box { max-width:400px; margin:auto; background:#fff; padding:20px; border-radius:10px }
    h2 { text-align:center }
    input, button { width:100%; padding:10px; margin-top:10px }
    button { background:#000; color:#fff; border:none; border-radius:5px }
    .msg { margin-top:15px; text-align:center }
  </style>
</head>
<body>

<div class="box">
  <h2>Yavuz & Neslihan<br>Wedding Hatıra Alanı</h2>

  <input type="text" id="name" placeholder="Ad Soyad" required>
  <input type="file" id="photos" multiple accept="image/*" onchange="if(this.files.length>5){alert('En fazla 5 fotoğraf yükleyebilirsiniz'); this.value='';}">

  <button onclick="upload()">Fotoğrafları Yükle</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const API_KEY = "bfe05935f11652eb8cde3dce47d36224";
const MAX_PHOTOS = 5;

function upload() {
  const name = document.getElementById("name").value.trim();
  const files = document.getElementById("photos").files;
  const msg = document.getElementById("msg");

 const TEST_MODE = true;

const now = new Date();
const start = new Date("2026-06-27T00:00:00");
const end = new Date("2026-06-28T00:00:00");

if (!TEST_MODE && (now < start || now > end)) {
    msg.innerText = "Fotoğraf yükleme süresi sona ermiştir. Katılımınız için teşekkür ederiz.";
    return;

  }

  if (!name) {
    msg.innerText = "Lütfen ad soyad giriniz.";
    return;
  }

  if (files.length === 0 || files.length > MAX_PHOTOS) {
    msg.innerText = "En fazla 5 fotoğraf yükleyebilirsiniz.";
    return;
  }

  msg.innerText = "Yükleniyor...";

  Array.from(files).forEach(file => {
    const formData = new FormData();
    formData.append("image", file);
    formData.append("name", name);

    fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(() => msg.innerText = "Fotoğraflar başarıyla yüklendi 🎉")
    .catch(() => msg.innerText = "Hata oluştu.");
  });
}
</script>

<script>
const CLOUD_NAME = "dr8vx5dlj";

const UPLOAD_PRESET = "wedding_upload";
const MAX_FILES = 5;
const TEST_MODE = true; // false yaparsan tarih kontrolü aktif olur

document.getElementById("uploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("guestName").value.trim();
    const files = document.getElementById("photos").files;

    if (!name) {
        alert("Lütfen isim giriniz");
        return;
    }

    if (files.length === 0) {
        alert("En az 1 fotoğraf seçmelisiniz");
        return;
    }

    if (files.length > MAX_FILES) {
        alert("En fazla 5 fotoğraf yükleyebilirsiniz");
        return;
    }

    for (let file of files) {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);
        formData.append("folder", "wedding/" + name);

        await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: "POST",
            body: formData
        });
    }

    alert("Fotoğraflar başarıyla yüklendi 🎉");
    document.getElementById("uploadForm").reset();
});
</script>
</body>

</html>
